name: Writing section migration

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine selected writing section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = '''<div class="writing-grid">
<a href="#"><span>Research</span><h3>Covert state-led interventions on social media</h3><p>Graduate research on influence operations and persuasion at scale.</p><b>↗</b></a>
<a href="#"><span>Economics</span><h3>Consumer protection &amp; government intervention</h3><p>First-prize essay on market failure and regulation in the digital economy.</p><b>↗</b></a>
<a href="https://arcg.is/0W4zO0" rel="noreferrer" target="_blank"><span>Data story</span><h3>Singapore’s housing programme</h3><p>Data scrollytelling on the political and developmental history of public housing.</p><b>↗</b></a>
</div>'''

          new = '''<div class="writing-grid">
<article class="writing-card"><span class="writing-label">🔎 Research</span><h3>Covert state-led interventions on social media</h3><p>Research into how states use covert social-media interventions to shape information environments, influence behaviour and persuade at scale.</p></article>
<article class="writing-card"><span class="writing-label">⚖️ Economics</span><h3>Consumer protection &amp; government intervention</h3><p>An analysis of when market failures justify government intervention in digital markets, and the trade-offs involved in protecting consumers without over-regulating innovation.</p></article>
<article class="writing-card"><span class="writing-label">🏙️ Data story</span><h3>Singapore’s housing programme</h3><p>An interactive data story tracing the political and developmental history of public housing and how it became central to Singapore’s model of development.</p><a class="writing-link" href="https://arcg.is/0W4zO0" rel="noreferrer" target="_blank">Explore the data story ↗</a></article>
</div>'''

          if old in s:
              s = s.replace(old, new, 1)

          css = r'''
          /* Editorial writing cards */
          .writing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
          .writing-card{border-top:1px solid var(--ink);padding:24px 4px 8px;text-decoration:none}
          .writing-label{display:block;margin-bottom:18px;font:500 11px/1.4 monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);text-decoration:none}
          .writing-card h3{font-size:24px;line-height:1.15;margin:0 0 12px;text-decoration:none}
          .writing-card p{margin:0;color:var(--muted);font-size:15px;line-height:1.6;text-decoration:none}
          .writing-link{display:inline-block;margin-top:18px;color:var(--ink);font-size:13px;font-weight:600;text-decoration:none;border-bottom:1px solid #cbd5e1;padding-bottom:2px}
          .writing-link:hover{border-color:var(--ink)}
          @media(max-width:820px){.writing-grid{grid-template-columns:1fr}.writing-card{padding:21px 0 24px}.writing-card h3{font-size:21px}.writing-card p{font-size:14.5px}.writing-label{margin-bottom:12px;font-size:10px}}
          '''

          if '/* Editorial writing cards */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s)
          PY
      - name: Commit writing refinements
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine selected writing section"
          git push
