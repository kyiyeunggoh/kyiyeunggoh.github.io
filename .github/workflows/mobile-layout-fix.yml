name: Builder credibility migration

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Scam Radar and strengthen tech stack
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          first_project = '''<a class="build-card" href="https://go.gov.sg/toopaisehv2" rel="noreferrer" target="_blank"><span class="build-num">01</span><div><p class="card-kicker">Anti-scam · Hackathon</p><h3>TooPaiseh v2</h3><p>A realistic scam-call simulation that helps people practise responding to social-engineering tactics.</p></div><span class="arrow">↗</span></a>'''

          scam_radar = '''<a class="build-card" href="https://github.com/kyiyeunggoh/peanut-butter-waffle-updates" rel="noreferrer" target="_blank"><span class="build-num">01</span><div><p class="card-kicker">AI · Trust &amp; Safety · Automation</p><h3>Scam Radar</h3><p>An end-to-end Telegram intelligence bot that ingests news, research and technical feeds on AI-enabled scams, scores relevance with LLMs, deduplicates results and delivers a scheduled daily brief.</p><div class="project-stack">Python · Gemini API · RSS/APIs · GitHub Actions · Telegram Bot API</div></div><span class="arrow">↗</span></a>
<a class="build-card" href="https://go.gov.sg/toopaisehv2" rel="noreferrer" target="_blank"><span class="build-num">02</span><div><p class="card-kicker">Anti-scam · Hackathon</p><h3>TooPaiseh v2</h3><p>A realistic scam-call simulation that helps people practise responding to social-engineering tactics.</p></div><span class="arrow">↗</span></a>'''

          if 'Scam Radar' not in s and first_project in s:
              s = s.replace(first_project, scam_radar, 1)
              s = s.replace('<span class="build-num">02</span><div><p class="card-kicker">Privacy · Public interest</p>', '<span class="build-num">03</span><div><p class="card-kicker">Privacy · Public interest</p>', 1)
              s = s.replace('<span class="build-num">03</span><div><p class="card-kicker">Travel · Consumer product</p>', '<span class="build-num">04</span><div><p class="card-kicker">Travel · Consumer product</p>', 1)
              s = s.replace('<span class="build-num">04</span><div><p class="card-kicker">AI · Consumer product</p>', '<span class="build-num">05</span><div><p class="card-kicker">AI · Consumer product</p>', 1)
              s = s.replace('<span class="build-num">05</span><div><p class="card-kicker">Personal data · Prototype</p>', '<span class="build-num">06</span><div><p class="card-kicker">Personal data · Prototype</p>', 1)
              s = s.replace('<span class="build-num">06</span><div><p class="card-kicker">Civic tech · Game</p>', '<span class="build-num">07</span><div><p class="card-kicker">Civic tech · Game</p>', 1)

          s = s.replace('<strong>Python</strong><small>Data · automation · prototyping</small>', '<strong>Python</strong><small>Automation · data pipelines · AI workflows</small>', 1)
          s = s.replace('<strong>Git / GitHub</strong><small>Build · version · deploy</small>', '<strong>Git / GitHub</strong><small>Version control · CI/CD · scheduled workflows</small>', 1)
          s = s.replace('<strong>Gemini</strong><small>LLM workflows · AI Studio</small>', '<strong>Gemini</strong><small>LLM evaluation · classification · summarisation</small>', 1)

          telegram_card = '''<div class="tech-card"><span class="logo logo-telegram">TG</span><div><strong>Telegram Bot API</strong><small>Bot interfaces · automated delivery</small></div></div>'''
          api_card = '''<div class="tech-card"><span class="logo logo-api">API</span><div><strong>APIs / RSS</strong><small>Data ingestion · integrations · feed processing</small></div></div>'''
          github_actions_card = '''<div class="tech-card"><span class="logo logo-actions">GA</span><div><strong>GitHub Actions</strong><small>Scheduling · automation · CI workflows</small></div></div>'''

          marker = '<div class="tech-card"><span class="logo logo-claude">A</span><div><strong>Claude</strong><small>Research · coding · prototyping</small></div></div>'
          if 'Telegram Bot API' not in s and marker in s:
              s = s.replace(marker, marker + '\n' + github_actions_card + '\n' + api_card + '\n' + telegram_card, 1)

          css = r'''
          /* Builder credibility */
          .project-stack{margin-top:12px;font:500 10px/1.5 monospace;letter-spacing:.03em;color:#64748b}
          .logo-actions{background:#f0f6ff;color:#2563eb;font-size:12px}
          .logo-api{background:#f8fafc;color:#334155;border:1px solid var(--line);font-size:10px;letter-spacing:.03em}
          .logo-telegram{background:#eef8ff;color:#229ed9;font-size:11px}
          @media(max-width:700px){.project-stack{font-size:9px;line-height:1.55;margin-top:10px}}
          '''
          if '/* Builder credibility */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s)
          PY
      - name: Commit builder credibility updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Scam Radar and strengthen builder tech stack"
          git push
