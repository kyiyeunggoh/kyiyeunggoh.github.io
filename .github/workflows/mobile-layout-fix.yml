name: Mobile layout migration

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply adaptive mobile styles
        run: |
          python - <<'PY'
          from pathlib import Path

          index_css = r'''
          /* Mobile-first adaptive layout */
          @media (max-width: 700px) {
            .shell { width: min(calc(100% - 32px), var(--max)); }
            .nav-wrap { min-height: 62px; gap: 10px; }
            .brand { flex: 0 0 auto; }
            .brand-name { display: none; }
            .brand-mark { width: 34px; height: 34px; font-size: 10px; }
            .nav { gap: 12px; flex-wrap: nowrap; margin-left: auto; }
            .nav a { font-size: 12px; white-space: nowrap; }
            .hero { grid-template-columns: 1fr; min-height: 0; padding: 58px 0 50px; gap: 0; }
            .hero-copy { max-width: none; }
            .hero-visual { display: none; }
            .eyebrow { font-size: 10px; margin-bottom: 13px; line-height: 1.5; }
            h1 { font-size: clamp(38px, 11vw, 48px); line-height: 1.02; margin-bottom: 22px; }
            h2 { font-size: clamp(30px, 8.5vw, 38px); line-height: 1.06; }
            h3 { font-size: 22px; line-height: 1.12; }
            .hero-lede { font-size: 18px; line-height: 1.55; }
            .hero-sub { font-size: 15px; line-height: 1.55; margin-bottom: 26px; }
            .button { min-height: 43px; padding: 0 15px; font-size: 13px; }
            .signals { grid-template-columns: 1fr 1fr; }
            .signals > div { padding: 20px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
            .signals > div:nth-child(2n) { border-right: 0; }
            .signals > div:nth-last-child(-n+2) { border-bottom: 0; }
            .signals > div:first-child, .signals > div:nth-child(3) { padding-left: 0; }
            .signals strong { font-size: 17px; }
            .signals span { font-size: 10.5px; line-height: 1.4; }
            .section { padding: 72px 0; }
            .section-intro { margin-bottom: 30px; }
            .section-intro > p:last-child { font-size: 15px; line-height: 1.6; }
            .feature-grid, .feature-grid-revised { grid-template-columns: 1fr; gap: 14px; }
            .feature-card, .feature-card-large, .anti-scam-card, .datastory-card, .idg-card, .ogp-card { grid-column: auto !important; min-height: 0 !important; padding: 22px !important; border-radius: 18px; }
            .feature-card-large h3 { font-size: clamp(34px, 9vw, 44px); line-height: 1.03; }
            .feature-card p { font-size: 15px; line-height: 1.6; }
            .card-topline { font-size: 9.5px; align-items: flex-start; }
            .card-topline span:last-child { white-space: nowrap; }
            .card-kicker { font-size: 9.5px !important; margin-bottom: 10px; }
            .anti-scam-content > p:not(.card-kicker) { max-width: none; }
            .anti-scam-card .metric-row, .datastory-card .metric-row, .idg-card .metric-row { margin-top: 20px; }
            .metric-row { grid-template-columns: 1fr; gap: 8px; }
            .metric-row > div { padding: 14px; }
            .metric-row strong { font-size: 20px; }
            .metric-row span { font-size: 10.5px; }
            .card-footer { margin-top: 22px !important; padding-top: 2px !important; gap: 7px 14px; font-size: 9.5px; line-height: 1.45; }
            .card-footer a { font-size: 13px; }
            .project-in-card { grid-template-columns: 40px 1fr; gap: 12px; padding: 18px 0; }
            .project-icon { width: 38px; height: 38px; border-radius: 10px; }
            .project-in-card h4 { font-size: 16px; }
            .project-in-card p { font-size: 13.5px; line-height: 1.55; }
            .project-in-card a, .source-link { font-size: 12px; }
            .build-grid { grid-template-columns: 1fr; }
            .build-card, .build-card:nth-child(odd), .build-card:nth-child(even) { grid-template-columns: 28px 1fr auto; min-height: 0; padding: 23px 0; gap: 12px; border-right: 0; }
            .build-card h3 { margin-bottom: 8px; }
            .build-card p { font-size: 13.5px; line-height: 1.5; }
            .build-num { font-size: 10px; }
            .arrow { font-size: 17px; }
            .tech-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .tech-card { min-height: 104px; padding: 14px; gap: 10px; border-radius: 15px; }
            .logo { flex-basis: 36px; width: 36px; height: 36px; }
            .tech-card strong { font-size: 13px; }
            .tech-card small { font-size: 10px; }
            .experience-row { grid-template-columns: 1fr; gap: 13px; padding: 28px 0; }
            .experience-meta > span { margin-bottom: 7px; }
            .experience-impact h3 { font-size: 21px; }
            .experience-impact > p { font-size: 14.5px; line-height: 1.55; }
            .impact-pills { gap: 6px; margin-top: 13px; }
            .impact-pills span { font-size: 9px; padding: 6px 8px; }
            .contact-section { padding-top: 64px; padding-bottom: 64px; }
            .contact-panel { padding: 24px; gap: 28px; border-radius: 18px; }
            .contact-copy p:last-child { font-size: 15px; }
            .contact-interests { font-size: 10px; }
            .about-teaser-inner { gap: 24px; }
            .about-teaser-inner p:last-child { font-size: 15px; }
            .footer-inner { flex-direction: column; align-items: flex-start; gap: 4px; }
          }
          @media (max-width: 390px) {
            .shell { width: min(calc(100% - 24px), var(--max)); }
            .nav { gap: 9px; }
            .nav a { font-size: 11px; }
            .brand-mark { width: 32px; height: 32px; }
            h1 { font-size: 37px; }
            .feature-card, .feature-card-large, .anti-scam-card, .datastory-card, .idg-card, .ogp-card { padding: 19px !important; }
            .tech-grid { grid-template-columns: 1fr; }
          }
          '''

          about_css = r'''
          /* Mobile-first adaptive layout */
          @media (max-width:700px){
            .shell{width:min(calc(100% - 32px),var(--max))}
            .nav-wrap{min-height:62px;gap:10px}.brand-name{display:none}.brand-mark{width:34px;height:34px;font-size:10px}
            .nav{gap:12px;flex-wrap:nowrap;margin-left:auto}.nav a{font-size:12px;white-space:nowrap}
            .section{padding:58px 0 76px}.about-layout{grid-template-columns:1fr;gap:30px}
            .portrait{position:relative;top:auto;width:128px;height:160px;border-radius:16px}
            h1{font-size:clamp(38px,11vw,48px);line-height:1.02;margin-bottom:22px}
            h2{font-size:clamp(28px,8vw,36px);margin:42px 0 16px}.lede{font-size:18px;line-height:1.55;margin-bottom:24px}
            .story p{font-size:15px;line-height:1.65;margin-bottom:19px}.pull-quote{margin:30px 0;padding:20px;font-size:17px;line-height:1.55;border-radius:0 14px 14px 0}
            .direction{margin-top:32px;padding:22px;border-radius:17px}.direction h2{font-size:28px;margin-bottom:12px}
            .interests{gap:6px}.interests span{font-size:9px;padding:6px 8px}.about-links{gap:9px;margin-top:28px}.button{min-height:42px;padding:0 14px;font-size:12px}
            .footer-inner{flex-direction:column;align-items:flex-start;gap:4px}
          }
          @media(max-width:390px){.shell{width:min(calc(100% - 24px),var(--max))}.nav{gap:9px}.nav a{font-size:11px}.brand-mark{width:32px;height:32px}.portrait{width:112px;height:140px}}
          '''

          for filename, css in [('index.html', index_css), ('about.html', about_css)]:
              p = Path(filename)
              s = p.read_text()
              if '/* Mobile-first adaptive layout */' not in s:
                  s = s.replace('</style>', css + '\n</style>', 1)
                  p.write_text(s)
          PY
      - name: Commit mobile layout
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html
          git commit -m "Add adaptive mobile layouts"
          git push
