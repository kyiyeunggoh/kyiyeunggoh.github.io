name: Pages diagnostic

on:
  push:
    branches: [master]

permissions:
  contents: write
  pages: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/pages > .pages-config.json
          cat .pages-config.json
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages-config.json
          git commit -m "Record Pages configuration" || exit 0
          git push
